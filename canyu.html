  <h1>共建與貢獻墻</h1>
  <p class="lead">
    歸集需要聲音證據，也需要校對的眼睛。
    三條通道，對應三種貢獻——<b>以學會為單位認領錄音</b>、<b>逐條糾錯</b>、<b>上榜留名</b>。
    每一份被採納的貢獻，都掛上這面墻。全部純靜態：不註冊、不上傳伺服器，表單一鍵寄出。
  </p>

  <div class="stats">
    <div class="stat"><div class="n" id="canyuRecorded">0</div><div class="l">段真人吟誦已收錄</div></div>
  </div>

  <div class="grid" id="canyuGrid"></div>

  <div class="card">
    <h3>怎麼共建</h3>
    <ul>
      <li><b>吟誦</b>：先看〈<a href="fengong.html">歸集進度</a>〉——以學會為單位認領，建議一次一整韻（三至四首）；認領時自訂承諾交件時間，逾期滿三個月仍未回覆者自動釋放。</li>
      <li><b>糾錯</b>：底本文字、反切、粵拼、入聲標記、多音字選音、分工表數據，都在可糾範圍。</li>
      <li><b>榮譽</b>：榜單只記真實發生並被採納的貢獻——候選名單、建議人選不列名。</li>
    </ul>
  </div>
